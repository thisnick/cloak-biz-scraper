name: CI

# Runs the test suite on every push to main and on PRs. The suite is fully
# hermetic — respx fakes the Notion API and the IP-echo services, and the
# fixtures set APP_SECRET — so no secrets or network are needed. The tests that
# need a real browser (Playwright layout checks) or node+martian (Notion
# markdown) skip themselves cleanly when those aren't present.
#
# NO SINGLE ENVIRONMENT RUNS THE WHOLE SUITE; the union is what is green. All
# three measured at 29ca730, 1397 collected in each:
#
#   macOS host   1389 passed,  8 skipped   Playwright yes, martian no
#   CI (Linux)   1371 passed, 26 skipped   both node groups yes, Playwright no
#   container    1357 passed, 40 skipped   martian yes, Chromium no (not in the
#                                          image by design — it downloads on demand)
#
# So a green badge here is a weaker signal than a green local run, and the
# container is NOT the place the skipped tests all run — it trades 8 skips for
# 40. Earlier wording in this file said otherwise and was wrong.
#
# Node is pinned below because two tests compare the dashboard's own JavaScript
# byte formatter against the server's — GitHub's runners happen to ship node, so
# those were executing incidentally rather than by arrangement. With it pinned,
# a skip in CI can no longer be legitimate, and those two fail instead (see
# TestOneByteFormatter): a guard that goes silent must not look like a pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
