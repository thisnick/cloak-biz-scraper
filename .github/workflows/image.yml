name: Publish image

# Every push to `release` (the deployed branch) builds the Dockerfile for
# linux/amd64 and linux/arm64 and publishes one multi-platform image to GHCR,
# so a self-hosted deployment can pull the exact image instead of building it:
#
#   ghcr.io/thisnick/cloak-biz-scraper:release      newest release
#   ghcr.io/thisnick/cloak-biz-scraper:sha-<short>  one commit, never moves
#
# Pin the digest the run prints (`image@sha256:…`) rather than a tag. It is the
# digest of the multi-platform index, so the same pin pulls the right image on
# an amd64 server and on an arm64 one; each image's
# org.opencontainers.image.revision label names the commit it came from.
# Railway keeps building from the repo and is unaffected.
#
# Each platform builds natively on its own runner (GitHub's arm64 runners are
# free for public repositories): no emulation, so arm64 takes about as long as
# amd64. A pull request that touches the image builds both platforms and
# publishes nothing, so a change that breaks either is caught before release.
#
# No secrets: GITHUB_TOKEN may write this repo's packages. The build needs
# none either (CloakBrowser is downloaded at runtime, not baked in).

on:
  push:
    branches: [release]
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - md2blocks/**
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Only a pull request leaves the image unpublished.
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only: tags go on the index the publish job assembles.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest, untagged: a platform's image is only reachable
      # through the index, so nobody pins one architecture by accident.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: >-
            ${{ env.PUBLISH == 'true'
                && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
                || 'type=cacheonly' }}
          # No attestation manifests: the index then lists exactly the two
          # platform images, and nothing labelled unknown/unknown.
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - if: env.PUBLISH == 'true'
        name: Keep the digest for the index
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish index
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `release` moves only on the release branch, so running this by hand
      # from another branch publishes a sha- tag and leaves deployments alone.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=release,enable=${{ github.ref == 'refs/heads/release' }}
            type=sha,prefix=sha-,format=short

      - name: Assemble the index
        working-directory: ${{ runner.temp }}/digests
        run: |
          # The tags and the digests are split into words on purpose.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Digest to pin
        run: |
          tag=$(jq -r '.tags[-1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$tag"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "### Published (linux/amd64, linux/arm64)"
            echo '```'
            echo "${IMAGE}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pin: ${IMAGE}@${digest}"
