name: Publish image

# Every push to `release` (the deployed branch) builds the Dockerfile and
# publishes it to GHCR, so a self-hosted deployment can pull the exact image
# instead of building it:
#
#   ghcr.io/thisnick/cloak-biz-scraper:release      newest release
#   ghcr.io/thisnick/cloak-biz-scraper:sha-<short>  one commit, never moves
#
# Pin the digest the run prints (`image@sha256:…`) rather than a tag; the
# image's org.opencontainers.image.revision label names the commit it came
# from. Railway keeps building from the repo and is unaffected.
#
# No secrets: GITHUB_TOKEN may write this repo's packages. The build needs
# none either (CloakBrowser is downloaded at runtime, not baked in).

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=release
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A plain single-platform image: no attestation manifest list, so
          # the digest below is the one `docker pull` reports.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest to pin
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Pin: ${IMAGE}@${{ steps.build.outputs.digest }}"
